<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess (Single & Two-Player)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <header class="game-header">
            <div class="timer-box" id="white-timer-box">
                <span class="timer-label">White (Player 1)</span>
                <span id="white-timer" class="timer">10:00</span>
            </div>
            <div class="status-box">
                <h2 id="game-status">Welcome! Click 'Start Game'</h2>
            </div>
            <div class="timer-box" id="black-timer-box">
                <span class="timer-label" id="black-label">Black (Brian AI)</span>
                <span id="black-timer" class="timer">10:00</span>
            </div>
        </header>

        <!-- Main Center Section -->
        <main class="game-main">
            <div class="board-wrapper">
                <div id="chess-board" class="chess-board"></div>
            </div>
            <aside class="history-panel">
                <h3>Movement History</h3>
                <div id="history-list" class="history-list"></div>
            </aside>
        </main>

        <!-- Footer Section -->
        <footer class="game-footer">
            <div class="mode-selector">
                <label for="game-mode">Mode:</label>
                <select id="game-mode">
                    <option value="ai">vs Brian AI</option>
                    <option value="2p">Two Player</option>
                </select>
            </div>
            <div class="action-buttons">
                <button id="start-btn" class="btn primary-btn">Start Game</button>
                <button id="undo-btn" class="btn secondary-btn" disabled>Undo Move</button>
                <button id="new-btn" class="btn secondary-btn">New Game</button>
            </div>
        </footer>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
