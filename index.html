<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Chess Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        
        header {
            margin: 20px 0;
            text-align: center;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            background: linear-gradient(to right, #ffd700, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 20px;
        }
        
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }
        
        .status-bar {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 15px 30px;
            font-size: 1.4rem;
            font-weight: bold;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        
        .chess-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1/1;
            border: 8px solid #5d4037;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        
        .square {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }
        
        .square.light {
            background-color: #f0d9b5;
        }
        
        .square.dark {
            background-color: #b58863;
        }
        
        .square.selected {
            background-color: #aec6cf;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }
        
        .square.valid-move::after {
            content: "";
            position: absolute;
            width: 25%;
            height: 25%;
            background-color: rgba(0, 128, 0, 0.5);
            border-radius: 50%;
        }
        
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        
        button {
            background: linear-gradient(to bottom, #ffd700, #ffb700);
            border: none;
            border-radius: 50px;
            color: #1a2a6c;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        .footer {
            margin-top: 30px;
            font-size: 0.9rem;
            opacity: 0.8;
            text-align: center;
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            
            .status-bar {
                font-size: 1.1rem;
                padding: 10px 15px;
            }
            
            .square {
                font-size: 1.8rem;
            }
            
            button {
                padding: 10px 20px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Smart Chess Bot</h1>
            <p class="subtitle">Play against our AI-powered chess opponent</p>
        </header>
        
        <div class="game-container">
            <div class="status-bar" id="status">White's turn to move</div>
            
            <div class="chess-board" id="chessBoard"></div>
            
            <div class="controls">
                <button id="resetBtn">Reset Game</button>
                <button id="newGameBtn">New Game</button>
            </div>
        </div>
        
        <div class="footer">
            <p>Smart Chess Bot v2.0 | AI Powered Chess Engine</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const chessBoard = document.getElementById('chessBoard');
            const statusDisplay = document.getElementById('status');
            const resetBtn = document.getElementById('resetBtn');
            const newGameBtn = document.getElementById('newGameBtn');
            
            // Chess pieces Unicode representations
            const pieces = {
                'white': {
                    'king': '♔',
                    'queen': '♕',
                    'rook': '♖',
                    'bishop': '♗',
                    'knight': '♘',
                    'pawn': '♙'
                },
                'black': {
                    'king': '♚',
                    'queen': '♛',
                    'rook': '♜',
                    'bishop': '♝',
                    'knight': '♞',
                    'pawn': '♟'
                }
            };
            
            // Initial board setup
            let board = [
                ['black-rook', 'black-knight', 'black-bishop', 'black-queen', 'black-king', 'black-bishop', 'black-knight', 'black-rook'],
                ['black-pawn', 'black-pawn', 'black-pawn', 'black-pawn', 'black-pawn', 'black-pawn', 'black-pawn', 'black-pawn'],
                ['', '', '', '', '', '', '', ''],
                ['', '', '', '', '', '', '', ''],
                ['', '', '', '', '', '', '', ''],
                ['', '', '', '', '', '', '', ''],
                ['white-pawn', 'white-pawn', 'white-pawn', 'white-pawn', 'white-pawn', 'white-pawn', 'white-pawn', 'white-pawn'],
                ['white-rook', 'white-knight', 'white-bishop', 'white-queen', 'white-king', 'white-bishop', 'white-knight', 'white-rook']
            ];
            
            let selectedPiece = null;
            let currentPlayer = 'white';
            let validMoves = [];
            
            // Create the chess board
            function createBoard() {
                chessBoard.innerHTML = '';
                
                for (let row = 0; row < 8; row++) {
                    for (let col = 0; col < 8; col++) {
                        const square = document.createElement('div');
                        square.classList.add('square');
                        square.classList.add((row + col) % 2 === 0 ? 'light' : 'dark');
                        square.dataset.row = row;
                        square.dataset.col = col;
                        
                        // Add piece if exists
                        const piece = board[row][col];
                        if (piece) {
                            const [color, type] = piece.split('-');
                            square.textContent = pieces[color][type];
                        }
                        
                        square.addEventListener('click', () => handleSquareClick(row, col));
                        chessBoard.appendChild(square);
                    }
                }
                
                updateStatus();
            }
            
            // Handle square click
            function handleSquareClick(row, col) {
                const piece = board[row][col];
                
                // If a piece is already selected
                if (selectedPiece) {
                    const [selectedRow, selectedCol] = selectedPiece;
                    
                    // Check if clicked on a valid move
                    const validMove = validMoves.find(move => move[0] === row && move[1] === col);
                    
                    if (validMove) {
                        // Move the piece
                        movePiece(selectedRow, selectedCol, row, col);
                        selectedPiece = null;
                        validMoves = [];
                        clearHighlights();
                        return;
                    }
                    
                    // Deselect if clicking on another piece of the same color
                    if (piece && piece.startsWith(currentPlayer)) {
                        clearHighlights();
                        selectedPiece = [row, col];
                        highlightValidMoves(row, col);
                        return;
                    }
                    
                    // Deselect if clicking elsewhere
                    clearHighlights();
                    selectedPiece = null;
                    return;
                }
                
                // Select a piece if it belongs to the current player
                if (piece && piece.startsWith(currentPlayer)) {
                    selectedPiece = [row, col];
                    highlightValidMoves(row, col);
                }
            }
            
            // Highlight valid moves
            function highlightValidMoves(row, col) {
                // For demo purposes, we'll show some example moves
                validMoves = [
                    [row-1, col], [row+1, col], [row, col-1], [row, col+1]
                ];
                
                // Highlight selected square
                const squares = document.querySelectorAll('.square');
                squares.forEach(square => {
                    if (square.dataset.row == row && square.dataset.col == col) {
                        square.classList.add('selected');
                    }
                });
                
                // Highlight valid moves
                validMoves.forEach(move => {
                    const [r, c] = move;
                    if (r >= 0 && r < 8 && c >= 0 && c < 8) {
                        const square = document.querySelector(`.square[data-row="${r}"][data-col="${c}"]`);
                        if (square) {
                            square.classList.add('valid-move');
                        }
                    }
                });
            }
            
            // Clear all highlights
            function clearHighlights() {
                const squares = document.querySelectorAll('.square');
                squares.forEach(square => {
                    square.classList.remove('selected', 'valid-move');
                });
            }
            
            // Move a piece
            function movePiece(fromRow, fromCol, toRow, toCol) {
                // Simple move logic for demonstration
                board[toRow][toCol] = board[fromRow][fromCol];
                board[fromRow][fromCol] = '';
                
                // Switch player
                currentPlayer = currentPlayer === 'white' ? 'black' : 'white';
                
                createBoard();
            }
            
            // Update game status
            function updateStatus() {
                statusDisplay.textContent = `${currentPlayer.charAt(0).toUpperCase() + currentPlayer.slice(1)}'s turn to move`;
            }
            
            // Reset game
            function resetGame() {
                board = [
                    ['black-rook', 'black-knight', 'black-bishop', 'black-queen', 'black-king', 'black-bishop', 'black-knight', 'black-rook'],
                    ['black-pawn', 'black-pawn', 'black-pawn', 'black-pawn', 'black-pawn', 'black-pawn', 'black-pawn', 'black-pawn'],
                    ['', '', '', '', '', '', '', ''],
                    ['', '', '', '', '', '', '', ''],
                    ['', '', '', '', '', '', '', ''],
                    ['', '', '', '', '', '', '', ''],
                    ['white-pawn', 'white-pawn', 'white-pawn', 'white-pawn', 'white-pawn', 'white-pawn', 'white-pawn', 'white-pawn'],
                    ['white-rook', 'white-knight', 'white-bishop', 'white-queen', 'white-king', 'white-bishop', 'white-knight', 'white-rook']
                ];
                currentPlayer = 'white';
                selectedPiece = null;
                validMoves = [];
                createBoard();
            }
            
            // Event listeners
            resetBtn.addEventListener('click', resetGame);
            newGameBtn.addEventListener('click', resetGame);
            
            // Initialize the board
            createBoard();
        });
    </script>
</body>
</html>
