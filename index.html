<!DOCTYPE html>
<html lang="en">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Grandmaster Chess (Single & Two-Player)</title>
        <link rel="stylesheet" href="style.css">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script type="module" src="game.js"></script>
        <script type="module" src="training.js"></script>
</head>

<body>
    <div class="game-container">
        <div class="training-panel">
            <h3>Training Performance Comparison</h3>
            <div class="chart-container">
                <canvas id="trainingChart"></canvas>
            </div>
        </div>
        <!-- Header Section -->
        <header class="game-header">
            <div class="status-box">
                <h2 id="game-status">White to move</h2>
            </div>
        </header>

        <!-- Main Center Section -->
        <main class="game-main">
            <div class="board-wrapper">
                <div id="chess-board" class="chess-board"></div>
            </div>
            <aside class="history-panel">
                <h3>Movement History</h3>
                <div id="history-list" class="history-list"></div>
            </aside>
        </main>
        <!-- Footer Section -->
        <footer class="game-footer">
            <div class="mode-selector">
                <label for="game-mode">Mode:</label>
                <select id="game-mode">
                    <option value="bot">vs Computer</option>
                    <option value="2p">Two Player</option>
                    <option value="train">Training Mode</option>
                </select>
            </div>
            <div class="action-buttons">
                <button id="train-btn" class="btn primary-btn">Run 1K Training</button>
                <button id="update-btn" class="btn primary-btn">Run 100K Training</button>
            </div>
        </footer>
    </div>
</body>

</html>
